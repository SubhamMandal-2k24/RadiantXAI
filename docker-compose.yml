services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: radiantxai-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./checkpoints:/checkpoints:ro
    restart: unless-stopped

